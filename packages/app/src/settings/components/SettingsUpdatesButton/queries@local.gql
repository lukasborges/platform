query GetAutoUpdateStatus @live @local {
  autoUpdateStatus {
    isDownloadingUpdate,
    isCheckingUpdate,
    isUpdateAvailable,
    releaseName,
  }
}

mutation CheckForUpdatesMutation @local {
  checkForUpdates,
}

mutation OpenReleaseNotesMutation @local {
  openReleaseNotes,
}

mutation QuitAndInstallMutation @local {
  quitAndInstall,
}
